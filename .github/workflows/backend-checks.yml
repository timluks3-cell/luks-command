name: Scanner regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-workspace.mjs
      - run: node --test tests/*.test.mjs
      - run: node --check workspace-core.js && node --check job-workspace.js
      - run: node --check scanner.js
      - run: node --check job-role-categories.js
      - run: npx --yes deno@2.9.6 check supabase/functions/scan-jobs/index.ts supabase/functions/scan-worker/index.ts supabase/functions/verify-job/index.ts


  workspace-privacy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify private references, drafts and concurrency
        env:
          PGPASSWORD: test_only_password
        run: psql -h localhost -U postgres -d workspace_test -f tests/workspace-rls.sql
