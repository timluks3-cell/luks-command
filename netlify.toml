[build]
  command = "mkdir -p dist && cp index.html scanner.js job-role-categories.js theme.css dist/ && node scripts/build-display-preview.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"



