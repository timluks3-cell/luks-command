<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luks Command</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--nav:#0b1020;--bg:#eef2f7;--text:#172033;--muted:#64748b;--line:#d9e1ec;--blue:#2563eb;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:var(--nav);color:white;padding:20px 14px}.brand{font-size:22px;font-weight:800;padding:8px 10px 20px}
nav button{display:block;width:100%;padding:11px 12px;margin:3px 0;border:0;border-radius:9px;background:transparent;color:#cbd5e1;text-align:left;cursor:pointer}nav button.active,nav button:hover{background:#1b2946;color:white}
main{padding:24px;max-width:1350px;width:100%;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.btn{padding:9px 12px;border-radius:9px;border:1px solid #cbd5e1;background:white;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:white}
.input,.select,.textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white}.textarea{min-height:130px}.muted{color:var(--muted);font-size:14px}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.good{color:var(--green)}.bad{color:var(--red)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--nav)}.loginbox{background:white;width:min(430px,100%);padding:25px;border-radius:16px}
.overlay{position:fixed;inset:0;background:#020617aa;display:grid;place-items:center;padding:20px;z-index:50}.modal{background:white;width:min(860px,100%);max-height:90vh;overflow:auto;padding:20px;border-radius:16px}
.sources{columns:3 230px}.source{break-inside:avoid;margin:5px 0}.status{padding:10px;border-radius:10px;margin:10px 0;background:#f8fafc}
@media(max-width:760px){.shell{grid-template-columns:1fr}aside{padding:8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{padding:14px}}
</style>
</head>
<body><div id="root">Starting Luks Command…</div>
<script>
const SUPABASE_URL="https://wqopxxzlfuifcfukydvn.supabase.co";
const SUPABASE_KEY="sb_publishable_88z0absfTqh4ixTfv5qTOQ_Vf3XSS9u";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});
const MASTER={roles:["Bygningskonstruktør","BIM Coordinator","BIM-koordinator","IKT-koordinator","Teknisk Designer","Architectural Technologist","Digital Construction","Junior Project Manager","4D Planner","BIM Model Spatial Coordinator","Revit Designer"],locations:["Copenhagen","Zealand","Denmark"],skills:["Revit","Navisworks Manage","clash detection","BIM coordination","ACC","BIM 360","Dalux","IFC","BEP","CDE","technical drawings","model QA","as-built","digital handover","RFIs","QA/QC","pyRevit","PRINCE2","Microsoft Project","pharmaceutical construction"]};
const SOURCES=[
["Core","LinkedIn Jobs","https://www.linkedin.com/jobs/"],["Core","Jobindex","https://www.jobindex.dk/"],["Core","Jobnet","https://jobnet.dk/"],["Core","Indeed Denmark","https://dk.indeed.com/"],["Core","JobLeads","https://www.jobleads.com/"],["Core","Akademikernes Jobbank","https://jobbank.dk/"],["Core","Konstruktørjob","https://www.konstruktoerjob.dk/"],["Core","Byggerijob","https://www.byggerijob.dk/"],["Core","Jooble","https://dk.jooble.org/"],["Core","Workindenmark","https://workindenmark.dk/"],
["Startup","The Hub","https://thehub.io/jobs"],["Startup","Y Combinator Jobs","https://www.ycombinator.com/jobs"],["Startup","BLOXHUB","https://bloxhub.org/"],["Startup","Arkitektforeningen","https://arkitektforeningen.dk/"],
["Recruiters","QCS Staffing","https://www.qcsstaffing.com/jobs/"],["Recruiters","ProSource Group","https://prosource.dk/"],["Recruiters","Moment","https://www.moment.dk/"],["Recruiters","Teamtailor","https://www.teamtailor.com/"],
["Employers","Sweco","https://www.sweco.dk/karriere/"],["Employers","Norconsult","https://norconsult.dk/karriere/"],["Employers","Ramboll","https://www.ramboll.com/careers"],["Employers","COWI","https://www.cowi.com/careers/"],["Employers","NIRAS","https://www.niras.com/careers/"],["Employers","WSP","https://www.wsp.com/en-gl/careers"],["Employers","Artelia","https://arteliagroup.dk/karriere/"],["Employers","AFRY","https://afry.com/en/join-us"],["Employers","Aarsleff","https://www.aarsleff.com/careers"],["Employers","PM Group","https://www.pmgroup-global.com/careers/"],["Employers","Dalux","https://www.dalux.com/careers/"],["Employers","Bravida","https://www.bravida.dk/job-og-karriere/"],
["Major","Novo Nordisk","https://www.novonordisk.com/careers.html"],["Major","NNE","https://www.nne.com/careers/"],["Major","Ørsted","https://orsted.com/en/careers"],["Major","Tesla Careers","https://www.tesla.com/careers"],["Major","HOFOR","https://www.hofor.dk/job/"],
["Public","Københavns Kommune","https://www.kk.dk/ledigestillinger"],["Public","Holbæk Kommune","https://holbaek.dk/om-kommunen/job-hos-os"],["Public","Region Hovedstaden","https://www.regionh.dk/job/"],["Public","Jobnet portal","https://job.jobnet.dk/"]
];
const PROJECT_LINKS={"Job Search":"https://command.luks.dk/","TiluTec":"https://tilutec.luks.dk/","4D Planner":"https://planner-4d-online.rachel-mumus.chatgpt.site/","Luks Portfolio":"https://www.luks.dk/"};
const MY_SITES=[
{name:"Luks Command",url:"https://command.luks.dk/",description:"Personal command centre"},
{name:"TiluTec",url:"https://tilutec.luks.dk/",description:"TiluTec collaboration site"},
{name:"4D Planner Online",url:"https://planner-4d-online.rachel-mumus.chatgpt.site/",description:"4D planning and construction sequencing"},
{name:"Luks Portfolio",url:"https://www.luks.dk/",description:"Architecture and BIM portfolio"},
{name:"Din vej til job og uddannelse",url:"https://wayfare-trip-compare.rachel-mumus.chatgpt.site/",description:"Job, education and planning tools"},
{name:"Start egen virksomhed",url:"https://wayfare-trip-compare.rachel-mumus.chatgpt.site/start-egen-virksomhed",description:"One-person business planner"}
];
let user=null,page="dashboard",localMode=false;
const E=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=d=>d?new Date(d).toLocaleDateString("en-GB"):"—";
function msg(t,k=""){const el=E("msg");if(el)el.innerHTML='<div class="status '+k+'">'+esc(t)+'</div>'}
function openExternal(url){const w=window.open(url,"_blank","noopener");if(!w)window.location.href=url}
async function init(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;render()}
db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;render()});
function render(){if(!user&&!localMode)return login();E("root").innerHTML='<div class="shell"><aside><div class="brand">Luks Command</div><nav>'+["dashboard","career","projects","sites","tasks","settings"].map(x=>'<button class="'+(page===x?"active":"")+'" onclick="go(\''+x+'\')">'+x[0].toUpperCase()+x.slice(1)+'</button>').join("")+'</nav></aside><main><div id="msg"></div><div id="view">Loading…</div></main></div>';loadPage()}
function go(p){page=p;render()}
function login(){E("root").innerHTML='<div class="login"><div class="loginbox"><h1>Luks Command</h1><p class="muted">Sign in once, or continue locally without login.</p><div id="msg"></div><label>Email<input id="email" class="input" type="email"></label><br><br><label>Password<input id="password" class="input" type="password"></label><div class="row" style="margin-top:14px"><button class="btn primary" onclick="signIn()">Sign in</button><button class="btn" onclick="signUp()">Create account</button></div><div style="height:10px"></div><button class="btn" style="width:100%" onclick="continueLocally()">Continue locally without login</button></div></div>'}
async function signIn(){const {error}=await db.auth.signInWithPassword({email:E("email").value.trim(),password:E("password").value});if(error)msg(error.message,"bad")}
async function signUp(){const {error}=await db.auth.signUp({email:E("email").value.trim(),password:E("password").value,options:{emailRedirectTo:"https://command.luks.dk/"}});msg(error?error.message:"Account created. Check your email.",error?"bad":"good")}
function continueLocally(){localMode=true;render()}
async function signOut(){localMode=false;await db.auth.signOut();render()}
async function loadPage(){if(page==="dashboard")return dashboard();if(page==="career")return career();if(page==="projects")return projects();if(page==="sites")return sites();if(page==="tasks")return tasks();if(page==="settings")return settings()}
async function dashboard(){if(localMode){E("view").innerHTML='<div class="row space"><h1>Dashboard</h1><button class="btn" onclick="signOut()">Exit local mode</button></div><div class="grid"><div class="card"><b>Career</b><p class="muted">Open job sources directly.</p></div><div class="card"><b>Projects</b><p class="muted">Open and continue your active projects.</p></div><div class="card"><b>My Sites</b><p class="muted">Open any of your live sites.</p><button class="btn primary" onclick="go(\'sites\')">Open sites</button></div></div>';return}
const [j,p,t]=await Promise.all([db.from("jobs").select("id,status"),db.from("projects").select("*").order("created_at"),db.from("tasks").select("*").neq("status","completed")]);
E("view").innerHTML='<div class="row space"><div><h1>Dashboard</h1><div class="muted">Database-backed Command Centre</div></div><button class="btn" onclick="signOut()">Sign out</button></div><div class="grid"><div class="card"><b>'+(j.data?.length||0)+'</b><div class="muted">Tracked jobs</div></div><div class="card"><b>'+(p.data?.length||0)+'</b><div class="muted">Projects</div></div><div class="card"><b>'+(t.data?.length||0)+'</b><div class="muted">Open tasks</div></div></div><h2>Projects</h2><div class="grid">'+(p.data||[]).map(projectCard).join("")+'</div><h2>My Sites</h2><div class="grid">'+MY_SITES.map(siteCard).join("")+'</div>'}
async function career(){let jobs=[];if(!localMode){const r=await db.from("jobs").select("*").order("created_at",{ascending:false});jobs=r.data||[]}
E("view").innerHTML='<div class="row space"><div><h1>Career</h1><div class="muted">Open actual job websites directly.</div></div><button class="btn primary" onclick="openSources()">Open job websites</button></div><div class="card"><b class="good">Current-jobs rule</b><p class="muted">Only treat a role as current after opening the live vacancy and confirming applications are still accepted.</p></div>'+(localMode?"":'<h2>Tracked jobs</h2>'+jobTable(jobs))}
function jobTable(rows){return '<div class="card" style="overflow:auto"><table><thead><tr><th>Role</th><th>Company</th><th>Status</th><th>Verification</th></tr></thead><tbody>'+rows.map(j=>'<tr><td><b>'+esc(j.title)+'</b><div class="muted">'+esc(j.location||"")+'</div></td><td>'+esc(j.company)+'</td><td>'+esc(j.status)+'</td><td>'+(j.verified_open?'<span class="good">Open</span>':esc(j.verification_status||"unverified"))+'</td></tr>').join("")+'</tbody></table></div>'}
function openSources(){const groups=[...new Set(SOURCES.map(x=>x[0]))];document.body.insertAdjacentHTML("beforeend",'<div class="overlay"><div class="modal"><div class="row space"><h2>Open job websites</h2><button class="btn" onclick="closeModal()">Close</button></div><div class="row">'+groups.map(g=>'<button class="btn" onclick="showGroup(\''+g+'\')">'+esc(g)+'</button>').join("")+'</div><h3>All sources</h3><div class="sources">'+SOURCES.map(([g,n,u])=>'<div class="source"><button class="btn" onclick="openExternal(\''+u+'\')">'+esc(n)+'</button></div>').join("")+'</div></div></div>')}
function showGroup(g){const list=SOURCES.filter(x=>x[0]===g);document.body.insertAdjacentHTML("beforeend",'<div class="overlay"><div class="modal"><div class="row space"><h2>'+esc(g)+'</h2><button class="btn" onclick="closeModal()">Close</button></div>'+list.map(([,n,u])=>'<button class="btn" style="margin:4px" onclick="openExternal(\''+u+'\')">'+esc(n)+'</button>').join("")+'</div></div>')}
function closeModal(){document.querySelector(".overlay")?.remove()}
function projectCard(p){const url=PROJECT_LINKS[p.name]||p.production_url||"";return '<div class="card"><div class="row space"><div><b style="font-size:18px">'+esc(p.name)+'</b><div class="muted">'+esc(p.current_state||p.status||"Active")+'</div></div><span class="pill">'+esc(p.status||"active")+'</span></div><p>'+esc(p.next_action||"No next action saved")+'</p><div class="row">'+(url?'<button class="btn primary" onclick="openProject(\''+esc(p.name)+'\')">Open project</button>':"")+'<button class="btn" onclick="continueProject(\''+esc(p.name)+'\')">Continue work</button></div></div>'}
async function projects(){if(localMode){const arr=[{name:"Job Search",status:"active",next_action:"Search current vacancies"},{name:"TiluTec",status:"active",next_action:"Continue account approval and messaging"},{name:"4D Planner",status:"active",next_action:"Verify synchronization"},{name:"Luks Portfolio",status:"active",next_action:"Review portfolio"}];E("view").innerHTML='<h1>Projects</h1><div class="grid">'+arr.map(projectCard).join("")+'</div>';return}const {data}=await db.from("projects").select("*").order("created_at");E("view").innerHTML='<h1>Projects</h1><div class="grid">'+(data||[]).map(projectCard).join("")+'</div>'}
function openProject(name){const u=PROJECT_LINKS[name];if(u)openExternal(u);else alert("No live URL saved for "+name)}
async function continueProject(name){let p={name};if(!localMode){const r=await db.from("projects").select("*").eq("name",name).maybeSingle();p=r.data||p}document.body.insertAdjacentHTML("beforeend",'<div class="overlay"><div class="modal"><div class="row space"><h2>Continue '+esc(name)+'</h2><button class="btn" onclick="closeModal()">Close</button></div><div class="card"><b>Current state</b><p>'+esc(p.current_state||"No current state saved")+'</p></div><div class="card"><b>Current problem</b><p>'+esc(p.current_problem||"No blocker saved")+'</p></div><div class="card"><b>Next action</b><p>'+esc(p.next_action||"No next action saved")+'</p></div></div></div>')}

function siteCard(s){
  return '<div class="card"><b style="font-size:18px">'+esc(s.name)+'</b><p class="muted">'+esc(s.description||"")+'</p><button class="btn primary" onclick="openExternal(\''+s.url+'\')">Open site</button></div>';
}
function sites(){
  E("view").innerHTML='<div class="row space"><div><h1>My Sites</h1><div class="muted">One-click access to your live websites and web apps.</div></div></div><div class="grid">'+MY_SITES.map(siteCard).join("")+'</div>';
}
async function tasks(){if(localMode){E("view").innerHTML='<h1>Tasks</h1><div class="card muted">Online task storage requires sign-in.</div>';return}const {data}=await db.from("tasks").select("*").order("due_at");E("view").innerHTML='<div class="row space"><h1>Tasks</h1><button class="btn primary" onclick="newTask()">New task</button></div>'+((data||[]).map(t=>'<div class="card"><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.category||"")+' · '+esc(t.priority||"normal")+' · '+fmt(t.due_at)+'</div></div>').join("")||'<div class="card muted">No tasks yet.</div>')}
async function newTask(){const title=prompt("Task title");if(!title)return;await db.from("tasks").insert({user_id:user.id,title,category:"Career",priority:"normal"});tasks()}
function settings(){E("view").innerHTML='<h1>Settings</h1><div class="card"><b>Mode</b><p class="muted">'+(localMode?"Local mode":"Online Supabase mode")+'</p></div>'}
window.addEventListener("error",e=>{document.body.innerHTML='<div style="padding:24px;font-family:Segoe UI"><h2>Runtime error</h2><p>'+esc(e.message)+'</p></div>'});
init();
</script>
</body></html>
